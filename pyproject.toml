[project]
name = "build-the-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
markers = ["live: calls real services (model or Freya); opt-in"]
